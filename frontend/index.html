<!doctype html>
<html lang="kk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#F0E8FA" />
    <meta name="description" content="BeautyChem AI: косметика құрамын камера арқылы тану және химиялық талдау" />
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" type="image/png" sizes="32x32" href="/icons/favicon-32.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="BeautyChem AI" />
    <title>BeautyChem AI</title>
    <style>
      /* Splash screen: React жүктелгенше көрінеді */
      html, body { margin: 0; background: #FFF8F3; }
      #splash {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 18px;
        background: linear-gradient(160deg, #FFF8F3 0%, #F0E8FA 60%, #F5DCE8 100%);
        color: #241638; font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
        transition: opacity .4s ease;
      }
      #splash.hide { opacity: 0; pointer-events: none; }
      #splash .logo { width: 96px; height: 96px; animation: spin 6s linear infinite; }
      #splash h1 { margin: 0; font-size: 26px; letter-spacing: .5px; }
      #splash h1 span { color: #8B5CF6; }
      #splash p { margin: 0; font-size: 14px; color: #5B4D73; }
      @keyframes spin { to { transform: rotate(360deg); } }
      @media (prefers-reduced-motion: reduce) { #splash .logo { animation: none; } }
    </style>
  </head>
  <body>
    <div id="splash" aria-hidden="true">
      <svg class="logo" viewBox="0 0 100 100" fill="none" stroke="#8B5CF6" stroke-width="3.5" stroke-linecap="round">
        <polygon points="50,18 77,34 77,66 50,82 23,66 23,34" />
        <line x1="50" y1="18" x2="50" y2="4" /><line x1="77" y1="66" x2="92" y2="74" /><line x1="23" y1="66" x2="8" y2="74" />
        <circle cx="50" cy="18" r="6" fill="#F5DCE8" /><circle cx="77" cy="34" r="6" fill="#8B5CF6" /><circle cx="77" cy="66" r="6" fill="#F5DCE8" />
        <circle cx="50" cy="82" r="6" fill="#8B5CF6" /><circle cx="23" cy="66" r="6" fill="#F5DCE8" /><circle cx="23" cy="34" r="6" fill="#8B5CF6" />
        <circle cx="50" cy="4" r="4" fill="#8B5CF6" /><circle cx="92" cy="74" r="4" fill="#8B5CF6" /><circle cx="8" cy="74" r="4" fill="#8B5CF6" />
      </svg>
      <h1>Beauty<span>Chem</span> AI</h1>
      <p>Косметика құрамының химиялық талдауы</p>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
